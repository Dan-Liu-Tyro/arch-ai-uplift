<!--
  Organizational versus world knowledge. The organizational boundary is the
  one structural line on the slide, so it is drawn as an actual boundary
  rather than implied by two boxes sitting apart. The bridge crossing it is
  the claim: world knowledge cannot be consumed directly, and once it has
  crossed it IS organizational knowledge, which is why the arrow ends inside
  the right hand region rather than beside it.

  The left stack narrows downward to carry "broad to specific" without a
  second axis or any labels about breadth.
-->
<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="World knowledge on the left, narrowing from general to
                 industry and domain standards. The organizational boundary
                 runs down the middle. A translation bridge crosses it into
                 organizational knowledge on the right, which is labelled as
                 the focus and the moat.">

  <!-- the boundary itself -->
  <path d="M 322 26 L 322 394" stroke="var(--ink-muted)" stroke-width="2"
        stroke-dasharray="7 5" fill="none"/>
  <text class="d-small" x="322" y="18" text-anchor="middle">the organizational boundary</text>

  <!-- ===== outside the boundary ===== -->
  <text class="d-label" x="20" y="48">World knowledge</text>
  <text class="d-sub"   x="20" y="67">Everything outside. Broad to specific.</text>

  <g stroke="var(--ink-muted)" stroke-width="1.5">
    <rect x="20"  y="86"  width="276" height="40" rx="5" fill="var(--surface-sunk)"/>
    <rect x="38"  y="134" width="240" height="40" rx="5" fill="var(--surface-sunk)"/>
    <rect x="56"  y="182" width="204" height="40" rx="5" fill="var(--surface-sunk)"/>
    <rect x="74"  y="230" width="168" height="40" rx="5"
          fill="var(--layer-knowledge)" fill-opacity="0.16"/>
  </g>
  <g class="d-small" fill="var(--ink)">
    <text x="158" y="111" text-anchor="middle">general knowledge</text>
    <text x="158" y="159" text-anchor="middle">technology knowledge</text>
    <text x="158" y="207" text-anchor="middle">engineering practice</text>
    <text x="158" y="248" text-anchor="middle">industry and domain</text>
    <text x="158" y="262" text-anchor="middle">standards</text>
  </g>
  <text class="d-small" x="20" y="300" fill="var(--ink-secondary)">card scheme rules,</text>
  <text class="d-small" x="20" y="316" fill="var(--ink-secondary)">regulation, domain models</text>

  <!-- ===== the bridge ===== -->
  <path class="d-flow" d="M 246 250 L 300 250 L 300 342 L 380 342"
        marker-end="url(#arrow-accent)" stroke-width="2.5"/>
  <rect x="272" y="288" width="56" height="26" rx="13" fill="var(--surface)"
        stroke="var(--accent)" stroke-width="2"/>
  <text x="300" y="305" text-anchor="middle" class="d-small"
        fill="var(--accent)" style="font-weight:600">translate</text>

  <!-- ===== inside the boundary ===== -->
  <text class="d-label" x="360" y="48">Organizational knowledge</text>
  <text class="d-sub"   x="360" y="67">Everything inside. Our focus, our moat.</text>

  <rect x="360" y="86" width="260" height="196" rx="7"
        fill="var(--layer-knowledge)" fill-opacity="0.12"
        stroke="var(--layer-knowledge)" stroke-width="2"/>
  <g fill="var(--surface)" stroke="var(--layer-knowledge)" stroke-width="1.5">
    <rect x="378" y="108" width="224" height="34" rx="5"/>
    <rect x="378" y="150" width="224" height="34" rx="5"/>
    <rect x="378" y="192" width="224" height="34" rx="5"/>
    <rect x="378" y="234" width="224" height="34" rx="5"/>
  </g>
  <g class="d-small" fill="var(--ink)" text-anchor="middle">
    <text x="490" y="129">how we build, run and decide</text>
    <text x="490" y="171">our systems, as they actually are</text>
    <text x="490" y="213">our rules, and why they exist</text>
    <text x="490" y="255">our interpretation of the outside</text>
  </g>

  <rect x="360" y="324" width="260" height="36" rx="5"
        fill="var(--accent)" fill-opacity="0.10"
        stroke="var(--accent)" stroke-width="1.5"/>
  <text x="490" y="347" text-anchor="middle" class="d-small"
        fill="var(--accent)" style="font-weight:600">once translated, it is ours</text>

  <text class="d-small" x="20" y="394" fill="var(--ink-secondary)">
    Nothing on the left can be consumed by an agent until it has crossed.
  </text>
</svg>
