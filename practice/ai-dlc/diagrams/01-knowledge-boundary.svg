<!--
  Organizational versus world knowledge. THE SUBJECT OF THIS SLIDE IS THE
  BRIDGE, not either side's contents.

  Deliberately asymmetric, and the asymmetry is the design:

    * The WORLD side is enumerated, because "broad to specific" is a claim
      slide 1 actually makes. Four identical boxes, ordered top to bottom.
    * The ORGANIZATIONAL side is NOT enumerated. Its examples are plain
      prose, marked "e.g.", so they read as illustration rather than as a
      classification. An earlier version drew them as four equal boxes,
      which gave examples the visual grammar of categories and invited
      exactly the question "shouldn't these be knowledge types?"

  It must stay that way. Slides 2 and 3 introduce the other axes: who
  controls the knowledge (first versus third party) and who owns it (the
  eight streams). Putting a type taxonomy here would pre-empt section 3
  with a less complete version of section 3's own cut, and the audience
  would read the difference between four and eight as meaningful.

  The bridge lands on "our interpreted compliance rulings" on purpose. Card
  scheme rules and regulation, the highlighted world box, become interpreted
  rulings, the highlighted organizational box. That is a real lineage from
  the document's own list, so the slide SHOWS translation instead of
  asserting it. The two highlighted boxes are a matched pair and share a
  centre line at y=272, which is what lets the arrow be dead horizontal.

  Geometry:
    boundary   x = 318
    org        x = 14..270   (container; bridge target flush at its right edge)
    world      x = 376..620  (four identical boxes, 244 x 40)
    bridge     y = 272, x 376 to 270, gate occluding its middle at x=318
-->
<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The organizational boundary runs down the middle.
                 Organizational knowledge on the left, described by example
                 rather than classified. World knowledge on the right in four
                 levels, from the entire internet down to industry and domain
                 standards. One horizontal arrow crosses the boundary through
                 a gate marked translate, running from card scheme rules and
                 regulation to our interpreted compliance rulings.">

  <!-- ===== the boundary, drawn first so the gate sits on it ===== -->
  <path d="M 318 26 L 318 376" stroke="var(--ink-muted)" stroke-width="2"
        stroke-dasharray="7 5" fill="none"/>
  <text class="d-small" x="318" y="18" text-anchor="middle">the organizational boundary</text>

  <!-- ===== inside: described, not classified ===== -->
  <text class="d-label" x="14" y="48">Organizational knowledge</text>
  <text class="d-sub"   x="14" y="67">Everything inside. Our focus, our moat.</text>

  <rect x="14" y="86" width="256" height="224" rx="7"
        fill="var(--layer-knowledge)" fill-opacity="0.12"
        stroke="var(--layer-knowledge)" stroke-width="2"/>

  <g class="d-small" fill="var(--ink-secondary)">
    <text x="30" y="116">e.g. how our payment services are</text>
    <text x="30" y="134">designed, our internal API contracts</text>
    <text x="30" y="152">and data models, our architecture</text>
    <text x="30" y="170">principles and decision records.</text>
  </g>

  <text class="d-small" x="30" y="236" fill="var(--accent)"
        style="font-weight:600">And one that came across the bridge:</text>
  <rect x="28" y="250" width="242" height="44" rx="5"
        fill="var(--accent)" fill-opacity="0.14"
        stroke="var(--accent)" stroke-width="2"/>
  <text x="149" y="277" text-anchor="middle" class="d-small" fill="var(--ink)"
        style="font-weight:600">our interpreted compliance rulings</text>

  <!-- ===== outside: enumerated, because the ordering is a claim ===== -->
  <text class="d-label" x="376" y="48">World knowledge</text>
  <text class="d-sub"   x="376" y="67">Everything outside. Broad to specific.</text>

  <g stroke="var(--ink-muted)" stroke-width="1.5" fill="var(--surface-sunk)">
    <rect x="376" y="108" width="244" height="40" rx="5"/>
    <rect x="376" y="156" width="244" height="40" rx="5"/>
    <rect x="376" y="204" width="244" height="40" rx="5"/>
  </g>
  <rect x="376" y="252" width="244" height="40" rx="5"
        fill="var(--accent)" fill-opacity="0.14"
        stroke="var(--accent)" stroke-width="2"/>
  <g class="d-small" fill="var(--ink)" text-anchor="middle">
    <text x="498" y="132">the entire internet</text>
    <text x="498" y="180">the model's baked-in wisdom</text>
    <text x="498" y="228">software engineering knowledge</text>
    <text x="498" y="276" style="font-weight:600">industry and domain standards</text>
  </g>
  <text class="d-small" x="376" y="312" fill="var(--ink-secondary)">card scheme rules, regulation,</text>
  <text class="d-small" x="376" y="327" fill="var(--ink-secondary)">reference domain models</text>

  <!-- ===== the bridge: one arrow, a terminus on each box's edge ===== -->
  <path d="M 376 272 L 270 272" class="d-flow" stroke-width="2.5"
        marker-end="url(#arrow-accent)"/>
  <circle cx="318" cy="272" r="13" fill="var(--surface)"
          stroke="var(--accent)" stroke-width="2"/>
  <text x="318" y="300" text-anchor="middle" class="d-small"
        fill="var(--accent)" style="font-weight:600">translate</text>

  <text class="d-small" x="14" y="400" fill="var(--ink-secondary)">
    Nothing on the right can be consumed until it crosses — and what crosses keeps its lineage.
  </text>
</svg>
