<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>kg-viz — knowledge graph</title>
<!--
  Self-contained: one CDN script tag and no build step, consistent with this
  repo's zero-new-infra stance (decision 1). 3d-force-graph draws the canvas;
  node labels are plain HTML positioned over it. Persistent labels are not
  optional for the flow view -- a hover-only tooltip makes you probe 26 nodes
  one at a time to see what you are looking at.

  Two views, deliberately not merged onto one canvas:
    - payments-target-state: sparse, directed, typed. Fixed swimlane layout
      (lane = stage, column = flow depth within the stage) so the payment path
      reads in order. This is the default view.
    - domain-authority: 39 domains x 296 not_authoritative_for edges, average
      degree ~15. Force layout. Only legible once you switch groups off, which
      is why the group toggles exist.
-->
<!--
  One external dependency: 3d-force-graph, loaded by the loader at the bottom
  of this file (vendor/ copy first, unpkg second), so a blocked CDN produces a
  readable on-screen message rather than a blank page.

  There used to be a second, `three-spritetext`, for node labels. It failed in
  a real browser with an opaque cross-origin "Script error." while
  3d-force-graph loaded normally -- it expects a global THREE, and
  3d-force-graph bundles its own without exposing it. Because the label
  accessor ran inside the render loop, every node threw and the canvas stayed
  empty beside a fully working control panel. Labels are now plain HTML
  positioned over the canvas, which removes the dependency and keeps text
  crisp at any zoom. Do not reintroduce a THREE-dependent text library.
-->
<style>
  html, body { margin: 0; height: 100%; background: #05070d; color: #e8ecf4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #graph { position: absolute; inset: 0; }
  .panel-base { position: absolute; background: rgba(12, 16, 26, 0.88);
    border: 1px solid rgba(120, 140, 180, 0.28); border-radius: 10px;
    padding: 12px 14px; backdrop-filter: blur(6px); z-index: 5; }
  #controls { top: 14px; left: 14px; width: 262px; max-height: calc(100vh - 28px);
    overflow-y: auto; font-size: 12.5px; }
  #controls h1 { font-size: 13px; margin: 0 0 4px; letter-spacing: 0.02em; color: #fff; }
  #controls .sub { color: #8d97ad; font-size: 11px; margin: 0 0 12px; line-height: 1.45; }
  .group-label { text-transform: uppercase; letter-spacing: 0.08em; font-size: 9.5px;
    color: #7b87a0; margin: 14px 0 6px; font-weight: 600; }
  .seg { display: flex; gap: 4px; }
  .seg button { flex: 1; background: rgba(255,255,255,0.05); color: #c6cde0;
    border: 1px solid rgba(120,140,180,0.25); border-radius: 6px; padding: 5px 4px;
    font-size: 11px; cursor: pointer; font-family: inherit; }
  .seg button:hover { background: rgba(255,255,255,0.11); }
  .seg button.on { background: #2d6cf6; border-color: #2d6cf6; color: #fff; }
  .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; cursor: pointer;
    user-select: none; line-height: 1.3; }
  .row input { accent-color: #2d6cf6; margin: 0; cursor: pointer; flex: none; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; flex: none;
    box-shadow: 0 0 6px currentColor; }
  .row.off { opacity: 0.42; }
  .count { color: #6f7b93; font-size: 10.5px; margin-left: auto; flex: none; }
  #stats { bottom: 14px; left: 14px; width: 262px; font-size: 11px; color: #9aa4ba;
    line-height: 1.5; }
  #stats b { color: #ffd479; }
  #detail { top: 14px; right: 14px; width: 330px; max-height: calc(100vh - 28px);
    overflow-y: auto; display: none; font-size: 12.5px; line-height: 1.5; }
  #detail.open { display: block; }
  #detail h2 { font-size: 15px; margin: 0 6px 2px 0; color: #fff; }
  #detail .meta { color: #8d97ad; font-size: 11px; margin-bottom: 10px; }
  .section-label { text-transform: uppercase; letter-spacing: 0.08em; font-size: 9.5px;
    color: #7b87a0; margin: 13px 0 4px; font-weight: 600; }
  .rel { margin: 0 0 8px; padding-left: 9px; border-left: 2px solid rgba(120,140,180,0.3); }
  .rel .pred { color: #6fe3a8; font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.03em; }
  .rel .pred.inbound { color: #ffb454; }
  .rel .who { color: #fff; }
  .rel .payload { color: #9aa4ba; font-size: 11.5px; }
  .rel .backedge { color: #ff7e8f; font-size: 10.5px; }
  .close { float: right; cursor: pointer; color: #8d97ad; font-size: 15px; line-height: 1; }
  .close:hover { color: #fff; }
  .pill { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 99px;
    border: 1px solid rgba(120,140,180,0.4); color: #c6cde0; margin: 0 4px 4px 0; }
  .pill.acq { border-color: #ffb454; color: #ffb454; }
  .pill.wide { border-color: #6fa8ff; color: #6fa8ff; }
  /* Labels live in screen space, not in the 3D scene, so they stay crisp and
     a constant size at any zoom. pointer-events:none keeps every click going
     through to the canvas underneath. */
  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 3;
    overflow: hidden; }
  .nlabel { position: absolute; top: 0; left: 0; white-space: nowrap;
    font-size: 11px; color: #e3e9f4; text-shadow: 0 0 4px #05070d,
    0 0 4px #05070d, 0 0 7px #05070d; will-change: transform; }
  .nlabel.dim { color: rgba(150, 160, 180, 0.35); text-shadow: none; }
  .nlabel.sel { color: #fff; font-weight: 600; }
  #hint { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: #67718a; z-index: 4; }
  /* Deliberately loud and centred. A silent blank canvas cost a round trip
     with the user; anything that stops the graph drawing must announce itself
     on screen, not only in the devtools console. */
  #notes { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    max-width: 620px; display: none; z-index: 9; background: rgba(60, 14, 20, 0.94);
    border: 1px solid #ff7e8f; border-radius: 10px; padding: 12px 16px;
    font-size: 12.5px; line-height: 1.55; color: #ffdfe3; }
  #notes.open { display: block; }
  #notes h3 { margin: 0 0 6px; font-size: 13px; color: #fff; }
  #notes code { background: rgba(0,0,0,0.35); padding: 1px 5px; border-radius: 4px; }
  #notes div + div { margin-top: 6px; }
</style>
</head>
<body>
  <div id="graph"></div>
  <div id="labels"></div>

  <div id="controls" class="panel-base">
    <h1>kg-viz</h1>
    <p class="sub" id="view-desc"></p>

    <div class="group-label">View</div>
    <div class="seg" id="view-seg"></div>

    <div class="group-label">Dimensions</div>
    <div class="seg" id="dim-seg">
      <button data-dim="2" class="on">2D plane</button>
      <button data-dim="3">3D</button>
    </div>

    <div class="group-label">Scope emphasis</div>
    <div class="seg" id="scope-seg">
      <button data-scope="all" class="on">All</button>
      <button data-scope="acquirer-specific">Acquirer</button>
      <button data-scope="tyro-wide">Tyro-wide</button>
    </div>

    <div class="group-label" id="groups-label">Groups</div>
    <div id="group-rows"></div>

    <div class="group-label">Display</div>
    <div class="row" id="labels-row">
      <input type="checkbox" id="labels-cb" checked />
      <span>Node labels</span>
    </div>
    <div class="seg" style="margin-top: 8px;">
      <button id="fit-btn">Fit to view</button>
    </div>
  </div>

  <div id="stats" class="panel-base"></div>

  <div id="detail" class="panel-base">
    <span class="close" onclick="closeDetail()">&#10005;</span>
    <div id="detail-body"></div>
  </div>

  <div id="hint">Click a node to inspect it and its relationships &middot; drag to pan &middot; scroll to zoom</div>

  <div id="notes"><h3>kg-viz diagnostics</h3><div id="notes-body"></div></div>

<script>
  var CATEGORY_COLORS = {
    "support-and-experience-channels": "#3fd0ff",
    "core-customer-and-product-domains": "#ff5f7e",
    "business-operations-domains": "#ffb454",
    "partner-integrations-and-value-add-services-domains": "#8b7bff",
    "data-and-intelligence-domains": "#4dff9e",
    "cross-domain-orchestrators": "#ff8ad8",
    "_uncategorized": "#8a93ab"
  };
  var KIND_COLORS = {
    "domain": "#3fd0ff", "actor": "#ffd479", "external": "#ff7e8f",
    "artefact": "#b79cff", "principle": "#4dff9e"
  };
  var STAGE_COLORS = ["#8b7bff", "#3fd0ff", "#4dff9e"];

  var COL_SPACING = 230, LANE_HEIGHT = 300, ROW_SPACING = 62;

  // Shown bottom-left. Bump this on any edit to this file. It exists because
  // a stale cached page is indistinguishable from a fix that did not work:
  // one round trip was spent on a report quoting a diagnostic string that had
  // already been deleted from disk. serve.py now sends no-store, so this is
  // the belt to that braces -- if the revision on screen is not the one you
  // expect, you are not looking at the current page.
  var PAGE_REVISION = "2026-09-22c — HTML labels, no three-spritetext";

  var DATA = null, view = null, Graph = null;
  var dims = 2, scopeMode = "all", showLabels = true;
  // Anything that prevents the graph drawing goes on screen. Errors thrown
  // inside the render loop never reach the fetch().catch() below, which is
  // why a broken node accessor previously produced a blank canvas next to a
  // perfectly healthy control panel.
  function note(html) {
    var body = document.getElementById("notes-body");
    var line = document.createElement("div");
    line.innerHTML = html;
    body.appendChild(line);
    document.getElementById("notes").classList.add("open");
  }

  window.addEventListener("error", function (e) {
    note("<b>JavaScript error:</b> " + escapeHtml(e.message) +
      (e.filename ? " <code>" + escapeHtml(String(e.filename).split("/").pop()) +
        ":" + e.lineno + "</code>" : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    note("<b>Unhandled promise rejection:</b> " +
      escapeHtml((e.reason && e.reason.message) || String(e.reason)));
  });
  var hiddenGroups = {};     // keyed per view id -> Set of hidden group keys
  var selected = null;
  var adjacency = {};

  function groupKeyOf(node) {
    return view.id === "payments-target-state" ? node.stage : (node.category || "_uncategorized");
  }

  function groupsForView() {
    if (view.id === "payments-target-state") {
      return view.stages.map(function (s, i) {
        return { key: s.id, label: s.ordinal + ". " + s.title, color: STAGE_COLORS[i % STAGE_COLORS.length] };
      });
    }
    var cats = DATA.categories.map(function (c) {
      return { key: c.id, label: c.title, color: CATEGORY_COLORS[c.id] || CATEGORY_COLORS._uncategorized };
    });
    cats.push({ key: "_uncategorized", label: "Uncategorized (e.g. principle)", color: CATEGORY_COLORS._uncategorized });
    return cats;
  }

  function colorFor(node) {
    if (view.id === "payments-target-state") {
      if (node.kind !== "domain") return KIND_COLORS[node.kind] || KIND_COLORS.domain;
      var i = view.stages.findIndex(function (s) { return s.id === node.stage; });
      return STAGE_COLORS[(i < 0 ? 0 : i) % STAGE_COLORS.length];
    }
    if (node.type !== "domain") return KIND_COLORS[node.type] || CATEGORY_COLORS._uncategorized;
    return CATEGORY_COLORS[node.category] || CATEGORY_COLORS._uncategorized;
  }

  function hiddenSet() {
    if (!hiddenGroups[view.id]) hiddenGroups[view.id] = {};
    return hiddenGroups[view.id];
  }

  function isHidden(node) { return !!hiddenSet()[groupKeyOf(node)]; }

  // Scope never hides -- it dims. Asked for explicitly: a domain filtered out
  // of an "acquirer" view is often exactly the boundary you are trying to see.
  function isDimmedByScope(node) {
    if (scopeMode === "all") return false;
    if (!node.scope) return true;
    return node.scope !== scopeMode;
  }

  function visibleData() {
    var nodes = view.nodes.filter(function (n) { return !isHidden(n); });
    var ids = {};
    nodes.forEach(function (n) { ids[n.id] = true; });
    var links = view.links.filter(function (l) {
      return ids[srcId(l)] && ids[tgtId(l)];
    });
    return { nodes: nodes, links: links };
  }

  // After the force engine runs, link.source/target are node objects, not ids.
  function srcId(l) { return typeof l.source === "object" ? l.source.id : l.source; }
  function tgtId(l) { return typeof l.target === "object" ? l.target.id : l.target; }

  function buildAdjacency() {
    adjacency = {};
    view.nodes.forEach(function (n) { adjacency[n.id] = { out: [], in: [] }; });
    view.links.forEach(function (l) {
      var s = srcId(l), t = tgtId(l);
      if (adjacency[s]) adjacency[s].out.push(l);
      if (adjacency[t]) adjacency[t].in.push(l);
    });
  }

  function applyLayout() {
    var fixed = view.layout === "layered";
    view.nodes.forEach(function (n) {
      if (fixed) {
        n.fx = n.col * COL_SPACING;
        n.fy = (n.lane - 1) * LANE_HEIGHT + n.row * ROW_SPACING - LANE_HEIGHT;
        n.fz = 0;
        // Seed x/y/z as well, not just the fx/fy/fz pins. zoomToFit() reads
        // x/y/z to compute bounds, and a node whose x is still undefined
        // yields NaN bounds and a camera that points nowhere -- which looks
        // exactly like an empty canvas. The force engine would normally copy
        // fx->x on init, but seeding directly removes the dependency on that
        // having happened before the first fit.
        n.x = n.fx; n.y = n.fy; n.z = 0;
      } else {
        delete n.fx; delete n.fy; delete n.fz;
      }
    });
  }

  function buildControls() {
    var seg = document.getElementById("view-seg");
    seg.innerHTML = "";
    DATA.views.forEach(function (v) {
      var b = document.createElement("button");
      b.textContent = v.id === "payments-target-state" ? "Payments flow" : "Authority";
      b.className = v.id === view.id ? "on" : "";
      b.onclick = function () { switchView(v.id); };
      seg.appendChild(b);
    });

    document.getElementById("view-desc").textContent = view.description;
    document.getElementById("groups-label").textContent =
      view.id === "payments-target-state" ? "Stages (show / hide)" : "Domain groups (show / hide)";

    var counts = {};
    view.nodes.forEach(function (n) {
      var k = groupKeyOf(n);
      counts[k] = (counts[k] || 0) + 1;
    });

    var rows = document.getElementById("group-rows");
    rows.innerHTML = "";
    groupsForView().forEach(function (g) {
      if (!counts[g.key]) return;
      var row = document.createElement("label");
      row.className = "row" + (hiddenSet()[g.key] ? " off" : "");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !hiddenSet()[g.key];
      cb.onchange = function () {
        if (cb.checked) delete hiddenSet()[g.key];
        else hiddenSet()[g.key] = true;
        row.className = "row" + (cb.checked ? "" : " off");
        refresh();
      };
      var sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = g.color;
      sw.style.color = g.color;
      var label = document.createElement("span");
      label.textContent = g.label;
      var count = document.createElement("span");
      count.className = "count";
      count.textContent = counts[g.key];
      row.appendChild(cb); row.appendChild(sw); row.appendChild(label); row.appendChild(count);
      rows.appendChild(row);
    });
  }

  function renderStats() {
    var vis = visibleData();
    var el = document.getElementById("stats");
    var lines = [
      "<b>" + vis.nodes.length + "</b> of " + view.nodes.length + " nodes &middot; " +
      "<b>" + vis.links.length + "</b> of " + view.links.length + " edges shown"
    ];
    if (view.stats.unresolved_references) {
      lines.push("<b>" + view.stats.unresolved_references.length + "</b> unresolved cross-domain " +
        "references — prose that never matched a modelled domain. A real gap, not hidden.");
    }
    if (view.stats.back_edges && view.stats.back_edges.length) {
      lines.push("<b>" + view.stats.back_edges.length + "</b> feedback arc(s), drawn dashed — " +
        "edges that loop back to an earlier stage.");
    }
    if (view.source_notes) {
      lines.push("Source is WIP; the whiteboard body is not machine-readable, so this is built " +
        "from its owner's structured text feed.");
    }
    lines.push('<span style="color:#67718a">page ' + escapeHtml(PAGE_REVISION) +
      "<br/>data generated " + escapeHtml(DATA.generated_at || "unknown") + "</span>");
    el.innerHTML = lines.join("<br/><br/>");
  }

  function escapeHtml(s) {
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function titleOf(id) {
    var n = view.nodes.find(function (x) { return x.id === id; });
    return n ? n.title : id;
  }

  function relHtml(link, direction) {
    var other = direction === "out" ? tgtId(link) : srcId(link);
    var arrow = direction === "out" ? "&rarr; " : "&larr; ";
    return '<div class="rel">' +
      '<div class="pred' + (direction === "in" ? " inbound" : "") + '">' +
        escapeHtml(link.label || link.predicate) + "</div>" +
      '<div class="who">' + arrow + escapeHtml(titleOf(other)) + "</div>" +
      (link.payload ? '<div class="payload">carries: ' + escapeHtml(link.payload) + "</div>"
                    : '<div class="payload">' + escapeHtml(link.description || "") + "</div>") +
      (link.back_edge ? '<div class="backedge">feedback arc (loops to an earlier stage)</div>' : "") +
      "</div>";
  }

  function renderDetail(node) {
    var adj = adjacency[node.id] || { out: [], in: [] };
    var scopePill = node.scope
      ? '<span class="pill ' + (node.scope === "acquirer-specific" ? "acq" : "wide") + '">' +
        escapeHtml(node.scope) + "</span>"
      : "";
    var html =
      "<h2>" + escapeHtml(node.title) + "</h2>" +
      '<div class="meta">' + escapeHtml(node.kind || node.type) +
        (node.boundary ? " &middot; " + escapeHtml(node.boundary) : "") +
        (node.status ? " &middot; " + escapeHtml(node.status) : "") + "</div>" +
      scopePill +
      (node.scope_note ? '<div class="payload" style="margin:6px 0 2px">' +
        escapeHtml(node.scope_note) + "</div>" : "");

    if (node.responsibility) {
      html += '<div class="section-label">Responsibility in this flow</div><div>' +
        escapeHtml(node.responsibility) + "</div>";
    }
    if (node.purpose) {
      html += '<div class="section-label">Purpose</div><div>' + escapeHtml(node.purpose) + "</div>";
    }
    if (node.touchpoints && node.touchpoints.length) {
      html += '<div class="section-label">Touchpoints</div><div>' +
        node.touchpoints.map(function (t) { return '<span class="pill">' + escapeHtml(t) + "</span>"; }).join("") +
        "</div>";
    }
    html += '<div class="section-label">Outbound (' + adj.out.length + ")</div>" +
      (adj.out.length ? adj.out.map(function (l) { return relHtml(l, "out"); }).join("")
                      : '<div class="payload">none</div>');
    html += '<div class="section-label">Inbound (' + adj.in.length + ")</div>" +
      (adj.in.length ? adj.in.map(function (l) { return relHtml(l, "in"); }).join("")
                     : '<div class="payload">none</div>');
    if (node.authority && view.id === "domain-authority") {
      html += '<div class="section-label">Authority</div><div class="payload">' +
        escapeHtml(node.authority) + "</div>";
    }
    document.getElementById("detail-body").innerHTML = html;
    document.getElementById("detail").classList.add("open");
  }

  function closeDetail() {
    selected = null;
    document.getElementById("detail").classList.remove("open");
    repaint();
  }
  window.closeDetail = closeDetail;

  function neighbourIds(node) {
    var adj = adjacency[node.id] || { out: [], in: [] };
    var set = {};
    set[node.id] = true;
    adj.out.forEach(function (l) { set[tgtId(l)] = true; });
    adj.in.forEach(function (l) { set[srcId(l)] = true; });
    return set;
  }

  function repaint() {
    // Re-assert the accessors so 3d-force-graph re-evaluates colours.
    Graph.nodeColor(Graph.nodeColor())
      .linkColor(Graph.linkColor())
      .linkWidth(Graph.linkWidth());
    rebuildLabels();
  }

  function refresh() {
    buildControls();
    Graph.graphData(visibleData());
    renderStats();
    repaint();
  }

  // ---- Node labels as an HTML overlay -------------------------------------
  //
  // Labels were originally SpriteText objects from `three-spritetext`. That
  // failed in the browser with an opaque cross-origin "Script error." while
  // `3d-force-graph` itself loaded fine: the sprite library expects a global
  // THREE, and 3d-force-graph bundles its own without exposing it. Because
  // the accessor ran inside the render loop, every node threw and the canvas
  // stayed empty next to a perfectly healthy control panel.
  //
  // Positioning plain HTML over the canvas via graph2ScreenCoords() removes
  // that dependency entirely, and is better on its own merits: text stays
  // crisp at any zoom instead of being a scaled texture, it is styleable in
  // CSS, and it cannot take the scene down. Cost is one rAF loop reprojecting
  // 26-40 points, which is nothing.
  var labelEls = {};

  function shortTitle(n) {
    return String(n.title).replace(/ Domain$/, "");
  }

  function rebuildLabels() {
    var host = document.getElementById("labels");
    host.innerHTML = "";
    labelEls = {};
    if (!showLabels) return;
    visibleData().nodes.forEach(function (n) {
      var el = document.createElement("div");
      el.className = "nlabel";
      el.textContent = shortTitle(n);
      host.appendChild(el);
      labelEls[n.id] = el;
    });
    positionLabels();
  }

  function positionLabels() {
    if (!Graph || !showLabels) return;
    var nodes = visibleData().nodes;
    var keep = selected ? neighbourIds(selected) : null;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var el = labelEls[n.id];
      if (!el) continue;
      if (!isFinite(n.x) || !isFinite(n.y)) { el.style.display = "none"; continue; }
      var p = Graph.graph2ScreenCoords(n.x, n.y, isFinite(n.z) ? n.z : 0);
      if (!p || !isFinite(p.x) || !isFinite(p.y)) { el.style.display = "none"; continue; }
      el.style.display = "block";
      el.style.transform = "translate(-50%, 0) translate(" + p.x + "px," + (p.y + 9) + "px)";
      var dim = keep ? !keep[n.id] : isDimmedByScope(n);
      el.className = "nlabel" + (dim ? " dim" : "") +
        (selected && selected.id === n.id ? " sel" : "");
    }
  }

  function labelLoop() {
    positionLabels();
    requestAnimationFrame(labelLoop);
  }

  function switchView(id) {
    view = DATA.views.find(function (v) { return v.id === id; });
    selected = null;
    document.getElementById("detail").classList.remove("open");
    buildAdjacency();
    applyLayout();
    Graph.numDimensions(dims).graphData(visibleData());
    buildControls();
    renderStats();
    repaint();
    setTimeout(function () { Graph.zoomToFit(600, 70); }, 350);
  }

  // Framing is done from a real measurement rather than a blind timeout,
  // because "camera pointed at NaN" and "nothing was drawn" look identical.
  function frameGraph() {
    var vis = visibleData();
    if (!vis.nodes.length) return;
    var finite = vis.nodes.filter(function (n) {
      return isFinite(n.x) && isFinite(n.y);
    });
    if (!finite.length) {
      note("<b>Nodes have no finite coordinates</b> — the camera has nothing " +
        "to frame, so the canvas is empty. This is a layout bug, not a data " +
        "problem: " + vis.nodes.length + " nodes were handed to the renderer.");
      return;
    }
    if (finite.length < vis.nodes.length) {
      note("<b>" + (vis.nodes.length - finite.length) + " of " + vis.nodes.length +
        "</b> nodes have non-finite coordinates and will not be drawn.");
    }
    Graph.zoomToFit(600, 70);
  }

  function boot() {
    if (typeof ForceGraph3D !== "function") {
      note("<b>3d-force-graph did not load.</b> The page is served from " +
        "localhost but the library comes from <code>unpkg.com</code>, so this " +
        "is usually a blocked network. Fix: save " +
        "<code>https://unpkg.com/3d-force-graph</code> as " +
        "<code>components/kg-viz/vendor/3d-force-graph.min.js</code> — the " +
        "page prefers that copy over the CDN whenever it exists. See " +
        "<code>vendor/README.md</code>.");
      return;
    }
    start();
  }

  function start() {
  fetch("graph.json").then(function (r) { return r.json(); }).then(function (data) {
    DATA = data;
    view = DATA.views.find(function (v) { return v.id === DATA.default_view; }) || DATA.views[0];
    buildAdjacency();
    applyLayout();

    Graph = ForceGraph3D()(document.getElementById("graph"))
      .backgroundColor("#05070d")
      .numDimensions(dims)
      .graphData(visibleData())
      .nodeLabel(function (n) { return n.title; })
      // Sized against the layout's own coordinate space: columns are 230
      // apart, so a radius in single digits renders as an almost invisible
      // speck once the whole graph is framed.
      .nodeRelSize(9)
      .nodeVal(function (n) { return n.kind === "domain" || n.type === "domain" ? 5 : 3; })
      .nodeColor(function (n) {
        var base = colorFor(n);
        if (selected) {
          var keep = neighbourIds(selected);
          if (n.id === selected.id) return "#ffffff";
          if (!keep[n.id]) return "rgba(110,120,140,0.18)";
          return base;
        }
        if (isDimmedByScope(n)) return "rgba(110,120,140,0.22)";
        return base;
      })
      // No nodeThreeObject: default spheres only. Labels are HTML, positioned
      // over the canvas -- see rebuildLabels(). Keeping this accessor unset
      // means there is no application code running inside the render loop
      // that can take the scene down.
      .linkDirectionalArrowLength(function (l) { return view.layout === "layered" ? 4 : 0; })
      .linkDirectionalArrowRelPos(1)
      .linkCurvature(function (l) { return l.back_edge ? 0.45 : 0; })
      .linkLabel(function (l) {
        return "<b>" + (l.label || l.predicate) + "</b>" + (l.payload ? "<br/>" + l.payload : "");
      })
      .linkColor(function (l) {
        var s = srcId(l), t = tgtId(l);
        if (selected) {
          var on = s === selected.id || t === selected.id;
          if (!on) return "rgba(110,120,140,0.07)";
          return l.back_edge ? "#ff7e8f" : "#6fe3a8";
        }
        if (l.back_edge) return "rgba(255,126,143,0.55)";
        return view.layout === "layered" ? "rgba(160,180,215,0.42)" : "rgba(130,150,190,0.16)";
      })
      .linkWidth(function (l) {
        if (!selected) return view.layout === "layered" ? 0.8 : 0.4;
        var s = srcId(l), t = tgtId(l);
        return (s === selected.id || t === selected.id) ? 2.2 : 0.3;
      })
      .onNodeClick(function (n) {
        selected = (selected && selected.id === n.id) ? null : n;
        if (selected) renderDetail(selected);
        else document.getElementById("detail").classList.remove("open");
        repaint();
      })
      .onBackgroundClick(closeDetail);

    document.getElementById("dim-seg").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        dims = parseInt(b.dataset.dim, 10);
        document.getElementById("dim-seg").querySelectorAll("button").forEach(function (x) {
          x.className = x === b ? "on" : "";
        });
        Graph.numDimensions(dims);
        setTimeout(function () { Graph.zoomToFit(600, 70); }, 350);
      };
    });

    document.getElementById("scope-seg").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        scopeMode = b.dataset.scope;
        document.getElementById("scope-seg").querySelectorAll("button").forEach(function (x) {
          x.className = x === b ? "on" : "";
        });
        repaint();
      };
    });

    document.getElementById("labels-cb").onchange = function (e) {
      showLabels = e.target.checked;
      if (!showLabels) document.getElementById("labels").innerHTML = "";
      repaint();
    };

    document.getElementById("fit-btn").onclick = function () { frameGraph(); };

    // 3d-force-graph sizes its renderer from the container once, at
    // construction, and does not follow the window. Without this, resizing
    // leaves the canvas at its original size and the label overlay -- which
    // reprojects against the live camera -- drifts out of alignment with it.
    window.addEventListener("resize", function () {
      var host = document.getElementById("graph");
      Graph.width(host.clientWidth).height(host.clientHeight);
    });

    labelLoop();

    Graph.onEngineStop(function () { frameGraph(); });

    buildControls();
    renderStats();
    rebuildLabels();
    setTimeout(frameGraph, 400);
  }).catch(function (err) {
    note("<b>Could not load graph.json:</b> " + escapeHtml(err.message) +
      "<br/>Run <code>./graph.sh restart</code> to regenerate it.");
  });
  }

  // Vendor copy first, CDN second. One library only -- labels are HTML now,
  // so there is no second script to go wrong.
  function loadFirstAvailable(urls, done) {
    var i = 0;
    (function attempt() {
      if (i >= urls.length) { done(false); return; }
      var s = document.createElement("script");
      s.src = urls[i++];
      s.onload = function () { done(true); };
      s.onerror = attempt;
      document.head.appendChild(s);
    })();
  }

  loadFirstAvailable(
    ["vendor/3d-force-graph.min.js", "https://unpkg.com/3d-force-graph"],
    function () { boot(); }
  );
</script>
</body>
</html>
