<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arc Lite</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
  }
  header { flex: 0 0 auto; }
  header h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  header p { font-size: 0.8rem; opacity: 0.7; margin: 0 0 1rem; }
  #log {
    flex: 1 1 auto;
    overflow-y: auto;
    border: 1px solid rgba(128,128,128,0.3);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .msg { margin-bottom: 1rem; white-space: pre-wrap; }
  .msg .who { font-weight: 600; font-size: 0.8rem; opacity: 0.6; display: block; }
  .msg.user .who::before { content: "You"; }
  .msg.arc .who::before { content: "Arc Lite"; }
  .msg.error .who::before { content: "Error"; }
  .msg.error { color: #c0392b; }
  .msg.warn .who::before { content: "Notice"; }
  .msg.warn { color: #b8860b; font-size: 0.85rem; }
  form { flex: 0 0 auto; display: flex; gap: 0.5rem; }
  input[type=text] {
    flex: 1 1 auto;
    padding: 0.6rem;
    border-radius: 6px;
    border: 1px solid rgba(128,128,128,0.4);
    font-size: 1rem;
  }
  button {
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    border: none;
    background: #4a4a8a;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Arc Lite</h1>
  <p>Local, experimental mirror of Arc. Not the real Arc, not connected to Confluence. Grounded only on this repo's constitution/ files.</p>
</header>
<div id="log"></div>
<form id="form">
  <input id="question" type="text" placeholder="Ask an architecture question..." autocomplete="off" autofocus>
  <button id="send" type="submit">Ask</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const button = document.getElementById("send");

  function addMessage(kind, text) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    const who = document.createElement("span");
    who.className = "who";
    div.appendChild(who);
    div.appendChild(document.createTextNode(text));
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    addMessage("user", question);
    input.value = "";
    button.disabled = true;
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "request failed");
      addMessage("arc", data.answer);
      if (data.compliant === false) {
        addMessage("warn", "Spec-compliance check failed on this answer — logged to gap-log.md.");
      }
    } catch (err) {
      addMessage("error", err.message);
    } finally {
      button.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
